[project]
name = "chat-software"
version = "0.1.0"
description = "Local-first desktop agent for files, clerical work, and development tasks."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "openai>=1.0",
  "anthropic>=0.34",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1",
  "langchain-core>=1.4",
  "langchain-mcp-adapters>=0.1",
  "mcp>=1.2",
  "pydantic>=2.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
chat-agent-service = "chat_software.server:main"
chat-file-ops-mcp = "chat_software.tools.mcp_server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
