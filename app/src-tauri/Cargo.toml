[package]
name = "chat-software"
version = "0.1.0"
description = "Local-first desktop agent shell"
authors = ["Chat_Software"]
edition = "2021"

[lib]
name = "chat_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
